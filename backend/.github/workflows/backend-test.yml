name: Backend CI

on:
  push:
    branches: [ "main", "test" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Spin up a temporary Postgres database for the tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: skinscan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Alembic Migrations
      env:
        DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/skinscan_test
        JWT_SECRET: "test_secret_do_not_use_in_prod"
        JWT_ALGORITHM: "HS256"
        TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
        SUPABASE_URL: "https://test.supabase.co"
        SUPABASE_KEY: "test"
        GEMINI_API_KEY: "test"
      run: |
        alembic upgrade head

    - name: Run Pytest
      env:
        DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/skinscan_test
        JWT_SECRET: "test_secret_do_not_use_in_prod"
        JWT_ALGORITHM: "HS256"
        TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA" # Dummy key for testing
        SUPABASE_URL: "https://test.supabase.co"
        SUPABASE_KEY: "test"
        GEMINI_API_KEY: "test"
      run: |
        PYTHONPATH=. pytest tests/ -v
